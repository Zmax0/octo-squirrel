[workspace]
resolver = "2"
members = [
    "octo-squirrel",
    "octo-squirrel-client",
    "octo-squirrel-server",
    "octo-squirrel-test",
]

[workspace.dependencies]
aead = { version = "0.6.1", features = ["bytes"] }
aes = "0.9.3"
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64ct = { version = "1.8.3", features = ["alloc"] }
blake3 = "1.8.7"
byte_string = "1.0.0"
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", features = ["reduced-round"] }
console-subscriber = "0.5.0"
crc = "3.4.0"
criterion = "0.8.2"
digest = "0.11.3"
ecb = "0.2.1"
futures = "0.3.34"
generic-array = "1.4.5"
h2 = "0.4"
hickory-resolver = "0.26.1"
hickory-client = "0.25.2"
hkdf = "0.13.0"
hmac = "0.13.0"
http = "1.5.0"
httparse = "1.10"
log = "0.4"
log4rs = "1.4.0"
lru_time_cache = "0.11"
md-5 = "0.11.0"
moka = "0.12.16"
quinn = { version = "0.11.11", features = ["runtime-tokio"] }
rand = { version = "0.10.2" }
rustls-platform-verifier = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
shake = "0.1.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.19", features = ["codec", "io", "net"] }
tokio-websockets = "0.13.3"
uuid = { version = "1.26.0", features = ["v4"] }
